<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milestone 1: Open Library JSON Data Display</title>

    <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background-color: #232323;
            color: white;
            margin: 0;
            padding: 0;
        }

        .navigation {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            background-color: #69369E;
            padding: 15px 20px;
            width: 100%;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navigation a {
            width: 160px;
            background-color: #7951A8;
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 15px 10px;
            font-size: 23px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }

        .navigation a:hover {
            background-color: #9066BE;
        }

        .container {
            width: 90%;
            max-width: 1400px;
            margin: 40px auto;
        }

        h1, h2 {
            text-align: center;
        }

        h1 {
            font-size: 40px;
            font-weight: normal;
        }

        .book {
            background-color: #828282;
            padding: 25px;
            margin: 30px auto;
            max-width: 800px;
            border-radius: 10px;
            box-shadow: 5px 5px 15px rgba(105, 54, 158, 0.5);
        }

        .book img {
            display: block;
            margin: 20px auto;
            max-width: 200px;
            border-radius: 5px;
        }

        .book p {
            line-height: 1.5;
        }

        .book a {
            color: white;
        }

        @media (max-width: 900px) {
            .navigation {
                flex-wrap: wrap;
            }

            .navigation a {
                margin: 5px;
            }
        }

        @media (max-width: 600px) {
            .container {
                width: 95%;
                margin-top: 25px;
            }

            h1 {
                font-size: 28px;
            }

            .navigation {
                flex-direction: column;
                gap: 10px;
            }

            .navigation a {
                width: 80%;
                font-size: 18px;
            }

            .book {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

    <nav class="navigation">

        <a href="../index.html">
            HOME
        </a>

        <a href="../labs.html">
            LABS
        </a>

        <a href="../projects.html">
            PROJECTS
        </a>

    </nav>

    <div class="container">

        <h1>Milestone 1: Open Library JSON Data Display</h1>
        <h2>Single-Book Information</h2>
        <div class="book" id="bookInfo"></div>

    </div>

    <script>
        $(function() {
            $.getJSON("book.json", function(json) {

                var bookHTML = "";

                bookHTML += "<h2>" + json.title + "</h2>";

                if (json.covers && json.covers.length > 0) {
                    bookHTML += "<img src='https://covers.openlibrary.org/b/id/" +
                        json.covers[0] + "-M.jpg' alt='Cover of " + json.title + "'>";
                }
                bookHTML += "<p><b>Publisher:</b> " +
                    (json.publishers ? json.publishers.join(", ") : "Unavailable") + "</p>";

                bookHTML += "<p><b>Publication Date:</b> " +
                    (json.publish_date || "Unavailable") + "</p>";

                bookHTML += "<p><b>Number of Pages:</b> " +
                    (json.number_of_pages || "Unavailable") + "</p>";

                bookHTML += "<p><b>ISBN-10:</b> " +
                    (json.isbn_10 ? json.isbn_10.join(", ") : "Unavailable") + "</p>";

                bookHTML += "<p><b>ISBN-13:</b> " +
                    (json.isbn_13 ? json.isbn_13.join(", ") : "Unavailable") + "</p>";

                bookHTML += "<p><b>Author:</b> " +
                    (json.authors && json.authors.length > 0 ?
                    "<a href='https://openlibrary.org" + json.authors[0].key +
                     "' target='_blank'>Roald Dahl</a>" : "Unavailable") + "</p>";

                bookHTML += "<p><b>First Sentence:</b> " +
                    (json.first_sentence ? json.first_sentence.value : "Unavailable") + "</p>";

                bookHTML += "<p><b>Contributors:</b> " +
                    (json.contributions ? json.contributions.join(", ") : "Unavailable") + "</p>";

                bookHTML += "<p><a href='https://openlibrary.org" +
                    json.key + "' target='_blank'>View Book on Open Library</a></p>";

                $("#bookInfo").html(bookHTML);

            }).fail(function() {
                $("#bookInfo").html("<p>Book Information Unavailable</p>");
            });

        });
    </script>

</body>
</html>
