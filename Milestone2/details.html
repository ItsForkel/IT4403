<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Milestone 2: Book Details</title>

    <script src="https://code.jquery.com/jquery-2.1.4.min.js"></script>
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <nav class="navigation">

        <a href="../projects.html">
            PROJECTS
        </a>

        <a href="index.html">
            HOME
        </a>

        <a href="bookshelf.html">
            MY BOOKSHELF
        </a>

    </nav>

    <div class="container">

        <h1>Milestone 2: Open Library API</h1>
        <h2>Book Details</h2>

        <div class="book" id="bookInfo"></div>

    </div>

    <script>
        $(function() {

            var parameters = new URLSearchParams(window.location.search);
            var workID = parameters.get("id");

            if (!workID || !/^OL[0-9]+W$/.test(workID)) {

                $("#bookInfo").html("<p>Book Information Unavailable</p>");

                return;

            }

            var bookURL = "https://openlibrary.org/works/" +
                workID + ".json";

            $.getJSON(bookURL, function(json) {

                var bookHTML = "";

                bookHTML += "<h2>" +
                    $("<div>").text(json.title || "Unavailable").html() +
                    "</h2>";

                if (json.covers && json.covers.length > 0 && json.covers[0] > 0) {

                    bookHTML += "<img src='https://covers.openlibrary.org/b/id/" +
                        json.covers[0] + "-M.jpg' alt='Book Cover'>";

                }
                else {

                    bookHTML += "<p>Cover Image Unavailable</p>";

                }

                bookHTML += "<p><b>Work ID:</b> " + workID + "</p>";

                var description = "Unavailable";

                if (json.description) {

                    if (typeof json.description == "string") {

                        description = json.description;

                    }
                    else if (json.description.value) {

                        description = json.description.value;

                    }

                }

                bookHTML += "<p><b>Description:</b> " +
                    $("<div>").text(description).html() + "</p>";

                if (json.subjects && json.subjects.length > 0) {

                    var subjects = json.subjects.slice(0, 10);

                    bookHTML += "<p><b>Subjects:</b> " +
                        $("<div>").text(subjects.join(", ")).html() + "</p>";

                }
                else {

                    bookHTML += "<p><b>Subjects:</b> Unavailable</p>";

                }

                bookHTML += "<p><a href='https://openlibrary.org/works/" +
                    workID + "' target='_blank'>View Book on Open Library</a></p>";

                $("#bookInfo").html(bookHTML);

            }).fail(function() {

                $("#bookInfo").html("<p>Book Information Unavailable. Please try again.</p>");

            });

        });
    </script>

</body>
</html>
